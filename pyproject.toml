[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "siim"
version = "0.9.1"
description = "Sliding Ice Incision Model (siim): coupled glacial-fluvial landscape evolution."
requires-python = ">=3.12"  # code uses 3.12 f-string syntax (quote reuse, PEP 701)
dependencies = [
    # The FULL standalone model: `import siim`, the 1D model (siim.siim1d),
    # the 2D model (siim.siim2d / siim.escarpment — in-house driver, D8/D-inf
    # router, FFT flexure, ADI diffusion since the 0.9.1 standalone flip),
    # siim.analytical and the plotting layer. xarray is a real core dep (the
    # driver's ds_out is an xarray Dataset; save/load pickle it) and is
    # deliberately UNPINNED — the historical <2026.5 freeze is an xsimlab
    # problem, quarantined to the optional adapter env (environment.yml).
    # No zarr, no dask: the in-house driver assembles ds_out in memory.
    "numpy",
    "scipy",
    "numba",
    "matplotlib",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
# The OPTIONAL fastscape/xsimlab adapter (siim.fastscape @xs.process shells +
# driver='xsimlab'). Best-effort convenience: fastscape and xarray-simlab ARE
# on PyPI, but PyPI's fastscape is a stale 0.1.0, and fastscapelib-fortran
# (the fortran backend fastscape's stock processes call at run time) has NO
# PyPI wheel — the validated adapter env is conda:
#   conda env create -f environment.yml
fastscape = ["fastscape", "xarray-simlab"]
# Dev-only: the fastscapelib (C++ successor) parity probe — a non-blocking,
# workflow_dispatch-only CI stub pre-1.0 (OQ-5; plan S5 decision note 16).
dev-parity = ["fastscapelib"]

[tool.setuptools]
packages = ["siim", "siim.analytical", "siim._core", "siim.plotting", "siim.fastscape"]

[tool.pytest.ini_options]
testpaths = ["siim/tests"]
markers = [
    # Tests needing the optional fastscape/xsimlab adapter stack (conda env;
    # environment.yml). CI: test-adapter runs `-m adapter` under micromamba,
    # test-standalone runs `-m 'not adapter'` on a plain pip env.
    "adapter: needs the optional fastscape/xsimlab adapter (conda env)",
]
filterwarnings = [
    # Third-party (xsimlab) deprecation noise — not siim's to fix. No category
    # qualifier: xarray escalated it DeprecationWarning -> FutureWarning on its
    # removal ladder (a category-pinned filter silently stopped matching).
    "ignore:dropping variables using",
]
