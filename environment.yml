# Optional Fastscape/xsimlab adapter and adapter-test environment. The
# standalone 1D and 2D models use a normal pip install and do not need this
# environment.
#
# *** Pinned to numpy<2 on purpose *** — fastscape's framework xarray-simlab
# 0.5.0 (unmaintained) calls np.in1d, which NumPy 2 removed (xr_accessor.py ->
# AttributeError on multi-clock runs). The numpy<2 / xarray<2026.5 / zarr<3
# quarantine constrains only this adapter environment, not a default install.
#
# Setup:
#   conda env create -f environment.yml
#   conda activate siim-adapter
#   python -m pip install -e . --no-deps  # preserve the quarantined pins
#
# Test:  python -m pytest siim/tests -q -m adapter
name: siim-adapter
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - "numpy<2"
  - scipy
  - matplotlib
  - pandas
  - numba
  - tqdm
  - fastscape
  - fastscapelib-f2py
  - xarray-simlab
  # xarray frozen below the removal of Dataset.drop (xsimlab 0.5.0 calls it
  # every run; currently a FutureWarning, an AttributeError crash once xarray
  # deletes the method — same quarantine class as numpy<2). 2026.4 verified.
  - "xarray<2026.5"
  - "zarr<3"
  # Analytical test oracle; not required at model runtime.
  - mpmath
  - pytest
